name: Deploy To FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ftp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing secret FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing secret FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing secret FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Missing secret FTP_SERVER_DIR"; exit 1; }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ftp, mbstring, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload changed files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/.editorconfig
            **/.gitattributes
            **/.gitignore
            **/.phpunit.result.cache
            **/.phpunit.cache/**
            **/README.md
            **/*.md
            **/*.cmd
            **/storage/**
            **/resources/**
            **/scripts/**
            **/database/database.sqlite
            **/phpunit.xml
            **/vite.config.js
            **/package.json
            **/package-lock.json
            **/public/hot
            **/public/storage/**
            **/public/contentFiles/**
            **/public/contentImages/**
            **/public/logo/**
            **/.ftp-deploy-sync-state.json
