name: Deploy To FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ftp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing secret FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing secret FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing secret FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Missing secret FTP_SERVER_DIR"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build with deletions
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          FTP_PORT="${FTP_PORT:-21}"
          FTP_PROTOCOL="${FTP_PROTOCOL:-ftp}"
          LFTP_URL="${FTP_PROTOCOL}://${FTP_SERVER}:${FTP_PORT}"

          lftp "$LFTP_URL" -u "$FTP_USERNAME","$FTP_PASSWORD" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ssl:verify-certificate no
          set xfer:clobber on
          mirror -R \
            --delete \
            --verbose=1 \
            --parallel=4 \
            public/build ${FTP_SERVER_DIR}public/build
          bye
          EOF

      - name: Upload public without deletions
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          FTP_PORT="${FTP_PORT:-21}"
          FTP_PROTOCOL="${FTP_PROTOCOL:-ftp}"
          LFTP_URL="${FTP_PROTOCOL}://${FTP_SERVER}:${FTP_PORT}"

          lftp "$LFTP_URL" -u "$FTP_USERNAME","$FTP_PASSWORD" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ssl:verify-certificate no
          set xfer:clobber on
          mirror -R \
            --verbose=1 \
            --parallel=4 \
            --exclude-glob build/** \
            --exclude-glob storage/** \
            --exclude-glob contentFiles/** \
            --exclude-glob contentImages/** \
            --exclude-glob logo/** \
            --exclude-glob hot \
            public ${FTP_SERVER_DIR}public
          bye
          EOF

      - name: Upload changed files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/.editorconfig
            **/.gitattributes
            **/.gitignore
            **/.phpunit.result.cache
            **/.phpunit.cache/**
            **/README.md
            **/*.md
            **/*.cmd
            **/vendor/**
            **/storage/**
            **/resources/**
            **/scripts/**
            **/database/database.sqlite
            **/phpunit.xml
            **/vite.config.js
            **/package.json
            **/package-lock.json
            **/public/**
            **/public/hot
            **/.ftp-deploy-sync-state.json
